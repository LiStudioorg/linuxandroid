name: Build Android APK

on:
  push:
    tags:
      - '*' # 打任何 tag 都会触发
  workflow_dispatch: # 支持手动触发（只编译，不发 Release）

permissions:
  contents: write # 必须要有写权限，否则无法创建 Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 替换掉了容易报错的 Setup Android SDK，直接接受预装SDK的许可证
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 1. 从 Secrets 解密出 keystore
      - name: Decode Keystore
        run: |
          mkdir -p ${{ runner.temp }}/keys
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/keys/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. 编译时传入环境变量
      - name: Build with Gradle (Release)
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keys/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 3. 上传 APK 作为临时产物
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 4. 仅在 tag 触发时发布 Release
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
