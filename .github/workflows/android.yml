name: Build Android APK

on:
  push:
    tags:
      - '*' # 打任何 tag 都会触发，自动发 Release
  workflow_dispatch: # 支持在 GitHub 网页上手动点击触发，只编译不发 Release

permissions:
  contents: write # 必须显式声明写权限，否则无法创建 Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 补充步骤：jniLibs/*.so 不入库，构建前从 Termux 官方仓库提取 PRoot，
      # 否则 APK 中缺少 libproot.so / libproot-loader.so，运行时无法启动 shell。
      - name: Fetch PRoot binaries from Termux deb
        run: |
          set -e
          BASE="https://packages.termux.dev/apt/termux-main"
          JNILIBS="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNILIBS"
          if [ ! -f "$JNILIBS/libproot.so" ] || [ ! -f "$JNILIBS/libproot-loader.so" ]; then
            wget -q "$BASE/pool/main/p/proot/proot_5.1.107.94_aarch64.deb" -O /tmp/proot.deb
            rm -rf /tmp/proot-ex && mkdir -p /tmp/proot-ex
            dpkg-deb -x /tmp/proot.deb /tmp/proot-ex
            cp /tmp/proot-ex/data/data/com.termux/files/usr/bin/proot \
               "$JNILIBS/libproot.so"
            cp /tmp/proot-ex/data/data/com.termux/files/usr/libexec/proot/loader \
               "$JNILIBS/libproot-loader.so"
            chmod 755 "$JNILIBS/libproot.so" "$JNILIBS/libproot-loader.so"
          fi
          ls -la "$JNILIBS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. 从 Secrets 解密出 keystore，放在临时目录
      - name: Decode Keystore
        run: |
          mkdir -p ${{ runner.temp }}/keys
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/keys/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. 编译时传入环境变量，告诉 Gradle 去哪里找 jks 和密码
      - name: Build with Gradle (Release)
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keys/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 3. 上传 APK 作为临时产物（手动触发时可以下载）
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 4. 仅在 tag 触发时发布 Release
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
